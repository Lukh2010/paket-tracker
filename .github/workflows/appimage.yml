name: AppImage

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run build:appimage

      - name: Test AppImage (Smoke & Persistence Test)
        run: npm run test:appimage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unterwegs-Linux-x86_64
          path: release/*.AppImage
          if-no-files-found: error

      - name: Publish GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.AppImage
